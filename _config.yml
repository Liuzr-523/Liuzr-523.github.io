# ── 主题 ──────────────────────────────────────────
# 自建模板：_layouts/ + assets/css/site.css，不再依赖 Chirpy
plugins:
  - jekyll-archives   # 生成 /categories/xxx/ 和 /tags/xxx/
  - jekyll-feed       # 生成 /feed.xml（RSS）
  - jekyll-sitemap    # 生成 /sitemap.xml
  - jekyll-seo-tag    # 页面标题、描述、分享卡片

# ── 语言与时区 ─────────────────────────────────────
lang: zh-CN
timezone: Asia/Shanghai

# ── 站点信息（想改的话就改这几行） ───────────────────
title: 刘子睿的小站
tagline: Attention Is All I Need
description: >-
  刘子睿的个人主页：苏州大学未来科学与工程学院大一学生，人工智能方向。
  记录物理、算法与新鲜科技的学习笔记，课程项目，以及写代码时踩过的坑。

url: "https://liuzr-523.github.io"

github:
  username: liuzr-523

social:
  name: 刘子睿            # 显示成文章默认作者和页脚版权人
  email:                  # 填上邮箱就会在侧栏显示邮箱图标，不想公开就留空
  links:
    - https://github.com/liuzr-523
    # 想加别的链接就照着上面那行的格式往下写，比如：
    # - https://www.zhihu.com/people/你的ID

# ── 侧栏头像 ───────────────────────────────────────
avatar: /assets/img/avatar.jpg

# ── 外观 ───────────────────────────────────────────
# 深浅色自动跟随系统
toc: true        # 文章显示目录（单篇可在 front matter 写 toc: false 关掉）

# ── 评论系统（先关着，以后想开再说） ──────────────────
comments:
  provider:      # 可选 disqus / utterances / giscus

# ── 以下保持默认即可 ────────────────────────────────
baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed


exclude:
  - scripts          # 加密 / 审核脚本只在本地用，不发布
  - accounts.json    # 账号明文清单，绝不能发布
  - Gemfile.lock
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - templates        # 作业模板，不要当网页渲染
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
