# ── 主题 ──────────────────────────────────────────
theme: jekyll-theme-chirpy

# ── 语言与时区 ─────────────────────────────────────
lang: zh-CN
timezone: Asia/Shanghai

# ── 站点信息（想改的话就改这几行） ───────────────────
title: 刘子睿的小站
tagline: 记录学习、折腾与生活
description: >-
  人工智能、计算机与数据科学方向的学习笔记、课程项目记录，
  以及写代码时踩过的坑。

url: "https://liuzr-523.github.io"

github:
  username: liuzr-523

social:
  name: 刘子睿            # 显示成文章默认作者和页脚版权人
  email:                  # 填上邮箱就会在侧栏显示邮箱图标，不想公开就留空
  links:
    - https://github.com/liuzr-523
    # 想加别的链接就照着上面那行的格式往下写，比如：
    # - https://www.zhihu.com/people/你的ID

# ── 侧栏头像 ───────────────────────────────────────
avatar: /assets/img/avatar.jpg

# ── 外观 ───────────────────────────────────────────
# 留空＝跟随系统深色/浅色；想固定就写 light 或 dark
theme_mode:
toc: true        # 文章右侧显示目录
paginate: 10

# ── 评论系统（先关着，以后想开再说） ──────────────────
comments:
  provider:      # 可选 disqus / utterances / giscus

# ── 以下保持默认即可 ────────────────────────────────
baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
